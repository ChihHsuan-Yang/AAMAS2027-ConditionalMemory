[project]
name = "p1mem"
version = "0.0.0"
description = "Measuring task-conditional value in long-term agent memory"
requires-python = ">=3.10"   # 3.9 FAILS: vendored scorer uses PEP 604 `str | None`

# Dependencies are deliberately minimal and will grow with the experiment design.
# Nothing is pinned yet because nothing is built yet: see docs/MASTER_TODO.md Phase 2.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# statsmodels is deliberately NOT required: it is absent from the dev environment, and
# MixedLM cannot fit the crossed random effects of ANALYSIS_PREREGISTRATION section 6
# without contortion. src/p1mem/analysis/decomposition.py implements REML directly on
# numpy + scipy, with the pre-registered method-of-moments fallback. matplotlib is
# needed only by the figure RENDERERS; the figure DATA functions (which answer "can the
# schema produce this figure?") import nothing beyond numpy/scipy.
analysis = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
