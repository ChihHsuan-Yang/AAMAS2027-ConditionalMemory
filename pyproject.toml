[project]
name = "p1mem"
version = "0.0.0"
description = "Measuring task-conditional value in long-term agent memory"
requires-python = ">=3.10"

# Dependencies are deliberately minimal and will grow with the experiment design.
# Nothing is pinned yet because nothing is built yet: see docs/MASTER_TODO.md Phase 2.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "statsmodels>=0.14"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
